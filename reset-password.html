<!doctype html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3202369836413899" crossorigin="anonymous"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose a new password — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
  </div>
</header>

<main>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="auth-lede" id="lede">Checking your reset link…</p>

      <p id="form-message" class="form-message"></p>

      <button type="button" class="btn btn-primary auth-submit" id="continue-btn" style="display:none;">Continue</button>

      <form id="reset-form" style="display:none;">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirm new password</label>
          <input type="password" id="password2" required minlength="6" placeholder="Type it again" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Save new password</button>
      </form>

      <p class="auth-switch" id="back-link" style="display:none;"><a href="forgot-password.html">Send me a new link</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("reset-form");
  const messageEl = document.getElementById("form-message");
  const submitBtn = document.getElementById("submit-btn");
  const lede = document.getElementById("lede");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "form-message " + type;
  }

  function linkProblem(text) {
    lede.textContent = "";
    showMessage(text, "error");
    form.style.display = "none";
    document.getElementById("back-link").style.display = "block";
  }

  function showForm() {
    lede.textContent = "Type your new password twice, then save it.";
    form.style.display = "block";
  }

  async function init() {
    // Expired or already-used links come back with an error in the address
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const queryParams = new URLSearchParams(window.location.search);
    const errDesc = hashParams.get("error_description") || queryParams.get("error_description");
    if (errDesc) {
      linkProblem("This reset link has expired or was already used. Ask for a new one below.");
      return;
    }

    // EduVerse email link (?token_hash=...&type=recovery): nothing happens until the student clicks Continue,
    // so email scanners that open links automatically cannot use up the link.
    const tokenHash = queryParams.get("token_hash");
    if (tokenHash) {
      lede.textContent = "Click Continue to choose your new password.";
      const btn = document.getElementById("continue-btn");
      btn.style.display = "block";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Checking…";
        const { error } = await supabaseClient.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
        btn.style.display = "none";
        if (error) {
          linkProblem("This reset link has expired or was already used. Ask for a new one below.");
          return;
        }
        history.replaceState(null, "", "reset-password.html");
        showForm();
      });
      return;
    }

    // Newer link format (?code=...)
    const code = queryParams.get("code");
    if (code) {
      const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
      if (error) {
        linkProblem("This reset link has expired or was already used. Ask for a new one below.");
        return;
      }
      showForm();
      return;
    }

    // Classic link format (#access_token=...&type=recovery): the library signs the user in automatically
    let ready = false;
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if ((event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") && session && !ready) {
        ready = true;
        showForm();
      }
    });

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && !ready) {
      ready = true;
      showForm();
      return;
    }

    setTimeout(() => {
      if (!ready) {
        linkProblem("Open this page from the reset link in your email. If the link is old, ask for a new one below.");
      }
    }, 2500);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMessage("", "");
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("password2").value;

    if (p1.length < 6) {
      showMessage("Your password must be at least 6 characters.", "error");
      return;
    }
    if (p1 !== p2) {
      showMessage("The two passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    const { error } = await supabaseClient.auth.updateUser({ password: p1 });

    if (error) {
      showMessage(error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Save new password";
      return;
    }

    form.style.display = "none";
    lede.textContent = "";
    showMessage("Your password has been changed. Taking you to your dashboard…", "success");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1800);
  });

  init();
</script>
</body>
</html>
