<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
  </div>
</header>

<main>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-lede">Log in to continue your studies.</p>

      <p id="form-message" class="form-message"></p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password" />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Log in</button>
      </form>

      <p class="auth-switch">New to EduVerse? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("login-form");
  const messageEl = document.getElementById("form-message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "form-message " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMessage("", "");
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage(error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
