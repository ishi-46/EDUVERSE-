<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
  </div>
</header>

<main>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="auth-lede">Enter the email you registered with. We'll send you a link to choose a new password.</p>

      <p id="form-message" class="form-message"></p>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Send reset link</button>
      </form>

      <p class="auth-switch">Remembered it? <a href="login.html">Back to log in</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("forgot-form");
  const messageEl = document.getElementById("form-message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "form-message " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMessage("", "");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const email = document.getElementById("email").value.trim();
    const redirectTo = window.location.origin + "/reset-password.html";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });

    if (error && /rate|seconds|too many/i.test(error.message)) {
      showMessage("Please wait a minute before asking for another link.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
      return;
    }
    if (error) {
      showMessage("Something went wrong: " + error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
      return;
    }

    // Same message whether or not the email exists, so nobody can check who is registered
    showMessage("If an account exists for " + email + ", a reset link is on its way. Check your inbox and spam folder. The link works once and expires after about an hour.", "success");
    submitBtn.textContent = "Link sent";
  });
</script>
</body>
</html>
