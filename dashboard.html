<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
    <nav class="nav-links">
      <a href="books.html">Books</a>
      <a href="qa.html">Q&amp;A</a>
      <a href="quizzes.html">Quizzes</a>
      <a href="challenge.html">Challenge</a>
      <a href="subscribe.html">Subscribe</a>
    </nav>
    <button class="btn btn-ghost" id="logout-btn" style="margin-left:auto;">Log out</button>
  </div>
</header>

<main>
  <div class="dashboard-shell">
    <h1 id="welcome">Loading your dashboard…</h1>
    <p id="loading-note">One moment.</p>

    <div class="dashboard-card" id="dashboard-card" style="display:none;">
      <div class="dashboard-row">
        <span>Level</span>
        <span id="level-value">—</span>
      </div>
      <div class="dashboard-row">
        <span>Subscription</span>
        <span id="subscription-value">—</span>
      </div>
      <div class="dashboard-row" id="ends-row" style="display:none;">
        <span>Plan ends</span>
        <span id="ends-value">—</span>
      </div>
      <div class="dashboard-row">
        <span>Email</span>
        <span id="email-value">—</span>
      </div>
    </div>
    <div id="trial-box" style="display:none; margin-top:20px;"></div>
    <p id="subscribe-prompt" style="display:none; margin-top:20px;">
      <a href="subscribe.html" class="btn btn-primary">Subscribe now</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="trial.js"></script>
<script>
  async function loadDashboard() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const user = session.user;

    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("full_name, level, subscription_status, subscription_ends_at, is_admin")
      .eq("id", user.id)
      .single();

    document.getElementById("loading-note").style.display = "none";
    document.getElementById("dashboard-card").style.display = "block";

    if (error || !profile) {
      document.getElementById("welcome").textContent = "Welcome!";
      document.getElementById("level-value").textContent = "Not set yet";
      document.getElementById("subscription-value").textContent = "Not set yet";
    } else {
      document.getElementById("welcome").textContent = "Welcome, " + profile.full_name + "!";
      document.getElementById("level-value").textContent = profile.level;

      if (profile.is_admin) {
        const adminLink = document.createElement("a");
        adminLink.href = "admin.html";
        adminLink.textContent = "Admin";
        document.querySelector(".nav-links").appendChild(adminLink);
      }

      let status = profile.subscription_status || "inactive";
      const endsAt = profile.subscription_ends_at ? new Date(profile.subscription_ends_at) : null;
      // If the end date has passed, show inactive straight away (the hourly job will also switch it off)
      if (!profile.is_admin && status === "active" && (!endsAt || endsAt <= new Date())) {
        status = "inactive";
      }
      const pill = document.createElement("span");
      pill.className = "status-pill " + (status === "active" ? "status-active" : status === "pending" ? "status-pending" : "status-inactive");
      pill.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      const subEl = document.getElementById("subscription-value");
      subEl.textContent = "";
      subEl.appendChild(pill);

      const endsRow = document.getElementById("ends-row");
      const endsEl = document.getElementById("ends-value");
      if (profile.is_admin) {
        endsRow.style.display = "flex";
        endsEl.textContent = "Admin — never expires";
      } else if (status === "active" && endsAt) {
        const msLeft = endsAt - new Date();
        const daysLeft = Math.ceil(msLeft / 86400000);
        const dateText = endsAt.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        const timeText = endsAt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        let leftText;
        if (msLeft < 86400000) {
          leftText = "ends today at " + timeText;
        } else {
          leftText = daysLeft + (daysLeft === 1 ? " day" : " days") + " left";
        }
        endsRow.style.display = "flex";
        endsEl.textContent = dateText + " (" + leftText + ")";
        if (daysLeft <= 3) {
          endsEl.style.color = "#c0392b";
          endsEl.style.fontWeight = "600";
          const prompt = document.getElementById("subscribe-prompt");
          prompt.querySelector("a").textContent = "Renew now";
          prompt.style.display = "block";
        }
      } else if (endsAt && endsAt <= new Date()) {
        endsRow.style.display = "flex";
        endsEl.textContent = "Ended on " + endsAt.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      }

      if (status !== "active") {
        document.getElementById("subscribe-prompt").style.display = "block";
      }
    }

    document.getElementById("email-value").textContent = user.email;
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  });

  loadDashboard().then(() => setupFreeTrial("trial-box"));
</script>
</body>
</html>
