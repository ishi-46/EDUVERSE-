<!doctype html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3202369836413899" crossorigin="anonymous"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
  </div>
</header>

<main>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-lede">Learn, practice, and test — all in one place.</p>

      <p id="form-message" class="form-message"></p>

      <div id="closed-box" class="dashboard-card" style="display:none; border-left:4px solid var(--gold, #B8892B); margin-bottom:16px;"></div>

      <form id="register-form">
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" required placeholder="First and last name" />
        </div>

        <div class="field">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" required />
        </div>

        <div class="field">
          <label for="level">Level</label>
          <select id="level" required>
            <option value="" disabled selected>Choose your level</option>
            <optgroup label="Primary">
              <option>P1</option><option>P2</option><option>P3</option>
              <option>P4</option><option>P5</option><option>P6</option>
            </optgroup>
            <optgroup label="Secondary">
              <option>S1</option><option>S2</option><option>S3</option>
              <option>S4</option><option>S5</option><option>S6</option>
            </optgroup>
          </select>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Register</button>
      </form>

      <p class="auth-switch">By registering, you agree to our <a href="terms.html">Terms</a>.</p>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("register-form");
  const messageEl = document.getElementById("form-message");
  const submitBtn = document.getElementById("submit-btn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "form-message " + type;
  }

  // Registration is closed every week from Friday 18:00 to Saturday 18:00 (Rwanda time, UTC+2).
  // The database blocks sign-ups in that window too; this part explains it to the visitor.
  function registrationWindow() {
    const RW = 2 * 3600 * 1000;                       // Rwanda is UTC+2 all year
    const k = new Date(Date.now() + RW);              // "Rwanda clock" read with getUTC*()
    const day = k.getUTCDay(), hour = k.getUTCHours();
    const closed = (day === 5 && hour >= 18) || (day === 6 && hour < 18);
    if (!closed) return { closed: false };
    const reopen = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate() + (day === 5 ? 1 : 0), 18, 0, 0) - RW);
    return { closed: true, reopen };
  }

  function showClosed(reopen) {
    const box = document.getElementById("closed-box");
    const fmtDay = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Kigali", weekday: "long", day: "numeric", month: "long" }).format(reopen);
    const left = Math.max(0, reopen - Date.now());
    const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
    box.innerHTML = `
      <p style="font-weight:600; margin-bottom:6px;">Registration is closed right now.</p>
      <p style="margin-bottom:10px;">New accounts can't be created from <strong>Friday 18:00</strong> to <strong>Saturday 18:00</strong> (Rwanda time).</p>
      <p style="margin-bottom:4px;">Please come back on <strong>${fmtDay} at 18:00</strong>.</p>
      <p style="margin-bottom:10px; color: var(--text-muted, #666);">${h === 0 && m === 0 ? "That's in less than a minute." : "That's in " + h + " h " + m + " min."}</p>
      <p style="margin-bottom:0; font-style:italic;">Kwiyandikisha bifunze kuva ku wa Gatanu saa 18:00 kugeza ku wa Gatandatu saa 18:00. Garuka ku wa Gatandatu saa 18:00.</p>`;
    box.style.display = "block";
    form.style.display = "none";
  }

  function checkWindow() {
    const w = registrationWindow();
    if (w.closed) { showClosed(w.reopen); return true; }
    if (form.style.display === "none") { window.location.reload(); }
    return false;
  }
  checkWindow();
  setInterval(checkWindow, 30000);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (checkWindow()) return;
    showMessage("", "");
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    const full_name = document.getElementById("full_name").value.trim();
    const dob = document.getElementById("dob").value;
    const level = document.getElementById("level").value;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Step 1: create the login (Supabase Auth), sending the profile details
    // along with it — a database trigger saves them into "profiles" automatically.
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name,
          date_of_birth: dob,
          level,
        },
      },
    });

    if (error) {
      if (/REGISTRATION_CLOSED|Database error saving new user/i.test(error.message)) {
        if (registrationWindow().closed) { checkWindow(); return; }
        showMessage("We couldn't create your account. Registration is closed every Friday 18:00 to Saturday 18:00 (Rwanda time). If it's outside that time, please try again or contact 01eduverse@gmail.com.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
        return;
      }
      showMessage(error.message, "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Register";
      return;
    }

    // If email confirmation is ON in Supabase, there's no session yet.
    if (!data.session) {
      showMessage("Account created! Check your email to confirm it, then log in.", "success");
      submitBtn.textContent = "Check your email";
      return;
    }

    showMessage("Account created! Redirecting…", "success");
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
