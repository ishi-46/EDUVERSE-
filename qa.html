<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&amp;A — EduVerse</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" class="brand-mark" width="28" height="28" />
      <span>EduVerse</span>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="qa.html">Q&amp;A</a>
      <a href="quizzes.html">Quizzes</a>
      <a href="challenge.html">Challenge</a>
      <a href="subscribe.html">Subscribe</a>
    </nav>
    <button class="btn btn-ghost" id="logout-btn" style="margin-left:auto;">Log out</button>
  </div>
</header>

<main>
  <div class="wrap" style="padding: 48px 24px;">
    <h1>Q&amp;A</h1>

    <div id="locked-note" style="display:none;" class="dashboard-card">
      <p style="margin-bottom:16px;">Practice questions are available once your subscription is active.</p>
      <a href="subscribe.html" class="btn btn-primary">Subscribe now</a>
    </div>

    <div id="page-content" style="display:none;">
      <p id="level-note" class="section-lede">Loading your level…</p>

      <div style="display:flex; gap:20px; flex-wrap:wrap;">
        <div class="field" style="max-width:220px; margin-top:20px;">
          <label for="topic-filter">Filter by subject</label>
          <select id="topic-filter">
            <option value="">All subjects</option>
          </select>
        </div>
        <div class="field" id="year-filter-wrap" style="max-width:220px; margin-top:20px; display:none;">
          <label for="year-filter">Filter by year/level</label>
          <select id="year-filter">
            <option value="">All years</option>
          </select>
        </div>
      </div>

      <div id="qa-list" class="content-list"></div>
      <p id="empty-note" style="display:none;">No Q&amp;A books have been added for your level yet — check back soon.</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const LEVEL_ORDER = ["P1","P2","P3","P4","P5","P6","S1","S2","S3","S4","S5","S6"];
  const EXAM_LEVELS = ["P6", "S3", "S6"];

  function getAllowedLevels(level) {
    if (!EXAM_LEVELS.includes(level)) return [level];
    const idx = LEVEL_ORDER.indexOf(level);
    const start = Math.max(0, idx - 2);
    return LEVEL_ORDER.slice(start, idx + 1);
  }

  let allBooks = [];
  let currentFilters = { topic: "", year: "" };

  async function openBook(path, el) {
    const meta = el.querySelector(".content-meta");
    const old = meta.textContent;
    meta.textContent = "Opening…";
    const { data, error } = await supabaseClient.storage.from("qa-books").createSignedUrl(path, 60);
    meta.textContent = old;
    if (error) { alert("Couldn't open this book: " + error.message); return; }
    window.open(data.signedUrl, "_blank", "noopener");
  }

  function renderQuestions() {
    const list = document.getElementById("qa-list");
    const emptyNote = document.getElementById("empty-note");
    const filtered = allBooks.filter((b) =>
      (!currentFilters.topic || b.subject === currentFilters.topic) &&
      (!currentFilters.year || b.class === currentFilters.year)
    );
    list.innerHTML = "";

    if (filtered.length === 0) {
      emptyNote.style.display = "block";
      return;
    }
    emptyNote.style.display = "none";

    filtered.forEach((b) => {
      const item = document.createElement("a");
      item.href = "#";
      item.className = "content-item";
      item.innerHTML = `
        <span class="content-title"></span>
        <span class="content-meta"></span>
      `;
      item.querySelector(".content-title").textContent = b.class + " " + b.subject + " — Questions & Answers";
      item.querySelector(".content-meta").textContent =
        (b.units || "?") + " units · " + (b.questions || "?") + " questions · " + (b.pages || "?") + " pages · PDF";
      item.addEventListener("click", (e) => { e.preventDefault(); openBook(b.file_path, item); });
      list.appendChild(item);
    });
  }

  async function loadQuestions() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("level, subscription_status, is_admin")
      .eq("id", session.user.id)
      .single();

    const hasAccess = profile && (profile.is_admin || profile.subscription_status === "active");
    if (!hasAccess) {
      document.getElementById("locked-note").style.display = "block";
      return;
    }
    document.getElementById("page-content").style.display = "block";

    // Admins see every class; students see their own level (plus exam-year access)
    const level = profile && !profile.is_admin ? profile.level : null;
    const allowedLevels = level ? getAllowedLevels(level) : null;

    document.getElementById("level-note").textContent = level
      ? (allowedLevels.length > 1
          ? "Showing Q&A books for " + allowedLevels.join(", ") + " (exam-year access)"
          : "Showing Q&A books for " + level)
      : "Admin view — showing Q&A books for all classes.";

    let query = supabaseClient.from("qa_books").select("*").order("class").order("subject");
    if (allowedLevels) query = query.in("class", allowedLevels);

    const { data: books, error } = await query;

    if (error) {
      document.getElementById("empty-note").textContent = "Couldn't load Q&A books: " + error.message;
      document.getElementById("empty-note").style.display = "block";
      return;
    }

    allBooks = books || [];

    const subjects = [...new Set(allBooks.map((b) => b.subject))].sort();
    const topicFilterEl = document.getElementById("topic-filter");
    subjects.forEach((s) => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      topicFilterEl.appendChild(opt);
    });

    const years = allowedLevels || LEVEL_ORDER.filter((l) => allBooks.some((b) => b.class === l));
    if (years.length > 1) {
      document.getElementById("year-filter-wrap").style.display = "block";
      const yearFilterEl = document.getElementById("year-filter");
      years.forEach((lvl) => {
        const opt = document.createElement("option");
        opt.value = lvl;
        opt.textContent = lvl;
        yearFilterEl.appendChild(opt);
      });
    }

    renderQuestions();
  }

  document.getElementById("topic-filter").addEventListener("change", (e) => {
    currentFilters.topic = e.target.value;
    renderQuestions();
  });
  document.getElementById("year-filter").addEventListener("change", (e) => {
    currentFilters.year = e.target.value;
    renderQuestions();
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  });

  loadQuestions();
</script>
</body>
</html>
